<title>Nomad Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#e9edf3; --ground2:#dfe5ee; --panel:#ffffff; --panel2:#f4f7fb;
  --ink:#111823; --ink2:#33415a; --muted:#63728a; --faint:#8d9aad;
  --line:#cfd8e4; --line2:#e2e9f1;
  --accent:#15637f; --accent-ink:#ffffff; --accent-soft:#d8ecf4;
  --rise:#1d7f5c; --cool:#b4562f; --warn:#8a6d1f;
  --land:#c9d3e0; --land-line:#aebacb; --sea:#e9edf3;
  --shadow:0 1px 2px rgba(16,28,45,.08),0 8px 24px rgba(16,28,45,.10);
  --h0:#241a45; --h1:#4a2270; --h2:#7d2a72; --h3:#b23566; --h4:#d95f3c; --h5:#f2952b; --h6:#ffd469;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ground:#080d14; --ground2:#0d141d; --panel:#111a25; --panel2:#16212e;
    --ink:#e8eef6; --ink2:#c2cede; --muted:#8697ad; --faint:#66788f;
    --line:#202d3d; --line2:#1a2634;
    --accent:#57c4e6; --accent-ink:#04212c; --accent-soft:#0f3446;
    --rise:#3ecf9a; --cool:#ef8256; --warn:#e0bc57;
    --land:#1a2634; --land-line:#2c3d51; --sea:#080d14;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#080d14; --ground2:#0d141d; --panel:#111a25; --panel2:#16212e;
  --ink:#e8eef6; --ink2:#c2cede; --muted:#8697ad; --faint:#66788f;
  --line:#202d3d; --line2:#1a2634;
  --accent:#57c4e6; --accent-ink:#04212c; --accent-soft:#0f3446;
  --rise:#3ecf9a; --cool:#ef8256; --warn:#e0bc57;
  --land:#1a2634; --land-line:#2c3d51; --sea:#080d14;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  margin:0; text-wrap:balance; letter-spacing:.005em}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:grid;height:100dvh;
  grid-template-columns:308px 1fr 0;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"bar bar bar" "rail map drawer" "rail foot drawer";}
#app.drawer-open{grid-template-columns:308px 1fr 372px}

/* ---------- top bar ---------- */
#bar{grid-area:bar;display:flex;align-items:center;gap:14px;
  padding:0 14px;height:52px;background:var(--panel);border-bottom:1px solid var(--line);
  position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:19px;font-weight:700;
  letter-spacing:.055em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--rise);flex:0 0 auto;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--rise) 60%,transparent);
  animation:ping 2.6s cubic-bezier(.2,.8,.4,1) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rise) 55%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#searchwrap{position:relative;flex:0 1 260px;margin-left:6px}
#search{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel2);font-size:13px}
#search::placeholder{color:var(--faint)}
#results{position:absolute;top:36px;left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  max-height:320px;overflow:auto;z-index:40}
#results button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:13px;
  border-bottom:1px solid var(--line2)}
#results button:hover,#results button.sel{background:var(--panel2)}
#results .sub{color:var(--muted);font-size:11px}
.spacer{flex:1 1 auto}
.layerbar{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;
  background:var(--panel2)}
.layerbar button{padding:6px 10px;font-size:11.5px;letter-spacing:.03em;color:var(--muted);
  border-right:1px solid var(--line)}
.layerbar button:last-child{border-right:none}
.layerbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.iconbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;
  display:grid;place-items:center;background:var(--panel2);font-size:14px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---------- rail ---------- */
#rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;z-index:20}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);
  min-width:0;max-width:100%;flex:0 0 auto}
.tabs button{padding:7px 9px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;flex:0 0 auto}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#railbody{flex:1 1 auto;overflow:auto;min-height:0}
.listhead{padding:11px 13px 6px;display:flex;align-items:baseline;gap:8px}
.listhead h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.listhead .n{font-size:11px;color:var(--faint)}
.listnote{padding:0 13px 9px;font-size:11.5px;color:var(--muted);line-height:1.45}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;
  padding:7px 13px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.row:hover{background:var(--panel2)}
.row.active{background:var(--accent-soft)}
.rank{font-size:10.5px;color:var(--faint);text-align:right}
.rname{font-size:13px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.score{font-size:15px;font-weight:600;text-align:right;min-width:30px}
.chip{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;
  border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.rise{color:var(--rise);border-color:color-mix(in srgb,var(--rise) 45%,transparent)}
.chip.cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

/* ---------- filters ---------- */
#filters{border-top:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
#filters summary{padding:9px 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
#filters summary::-webkit-details-marker{display:none}
.fgrid{padding:2px 13px 12px;display:grid;gap:9px}
.fgrid label{display:grid;gap:3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted)}
.fgrid select,.fgrid input[type=range]{width:100%}
.fgrid select{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px;font-size:12.5px}
.frow{display:flex;gap:8px}
.frow>label{flex:1}
.fval{color:var(--ink);font-weight:600}
#reset{font-size:11px;color:var(--accent);text-decoration:underline;justify-self:start}

/* ---------- map ---------- */
#mapwrap{grid-area:map;position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;z-index:12;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);
  padding:8px 10px;max-width:270px;font-size:12px;opacity:0;visibility:hidden;
  transition:opacity .09s;left:0;top:0}
#tip.on{opacity:1;visibility:visible}
#tip .tt{font-weight:600;font-size:12.5px;margin-bottom:2px}
#tip .tr{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}
#tip .tr b{color:var(--ink);font-weight:600}
.mapctl{position:absolute;z-index:11;display:flex;flex-direction:column;gap:5px}
.mapctl.zoom{right:11px;top:11px}
.mapctl button{width:30px;height:30px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;box-shadow:var(--shadow);font-size:15px;display:grid;place-items:center}
#resbadge{position:absolute;left:11px;top:11px;z-index:11;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  padding:5px 9px;font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
#resbadge b{color:var(--ink)}
#emptynote{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:11;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:10px 14px;font-size:12.5px;color:var(--muted);max-width:300px;text-align:center;display:none}

/* ---------- footer ---------- */
#foot{grid-area:foot;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:6px 13px;background:var(--panel);border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);z-index:20}
.ramp{display:flex;align-items:center;gap:7px}
.ramp .bar{width:168px;height:9px;border-radius:2px;
  background:linear-gradient(90deg,var(--h0),var(--h1) 38%,var(--h2) 55%,var(--h3) 70%,var(--h4) 80%,var(--h5) 90%,var(--h6))}
.ramp .lab{display:flex;justify-content:space-between;width:168px;font-size:9px;letter-spacing:.04em}
#foot a{color:var(--muted)}

/* ---------- drawer ---------- */
#drawer{grid-area:drawer;background:var(--panel);border-left:1px solid var(--line);
  overflow:auto;min-width:0;display:none;z-index:25}
#app.drawer-open #drawer{display:block}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 14px 10px;z-index:2}
.dhead .eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dhead h2{font-size:21px;font-weight:600;margin:2px 0 1px}
.dhead .where{font-size:12px;color:var(--muted)}
#dclose{position:absolute;top:10px;right:11px;width:26px;height:26px;border-radius:5px;
  border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.dbody{padding:0 14px 26px}
.sec{padding:13px 0;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.sec h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.bigrow{display:flex;align-items:flex-end;gap:14px;padding:12px 0 4px}
.bigscore{font-size:46px;font-weight:600;line-height:.92;letter-spacing:-.02em}
.bigmeta{display:grid;gap:2px;font-size:11.5px;color:var(--muted);padding-bottom:4px}
.bigmeta b{color:var(--ink)}
.metric{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;
  padding:3px 0;font-size:12px}
.metric .track{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.metric .fill{height:100%;border-radius:2px}
.metric .lb{color:var(--ink2)}
.metric .vl{text-align:right;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  background:color-mix(in srgb,var(--warn) 9%,transparent);
  border-radius:6px;padding:8px 10px;margin-bottom:7px}
.warnbox .wt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);font-weight:600}
.warnbox .wd{font-size:11.5px;color:var(--ink2);margin-top:2px}
.evrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--line2);font-size:11.5px;align-items:start}
.evrow:last-child{border-bottom:none}
.evrow .et{color:var(--ink);line-height:1.35}
.evrow .em{color:var(--faint);font-size:10.5px;margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.evrow .ea{color:var(--muted);font-size:10.5px;white-space:nowrap;text-align:right}
.evrow a{color:var(--accent)}
.hotrow{display:grid;grid-template-columns:1fr auto;gap:9px;padding:6px 0;
  border-bottom:1px solid var(--line2);font-size:12px;width:100%;text-align:left;align-items:center}
.hotrow:hover{background:var(--panel2)}
.hotrow:last-child{border-bottom:none}
.spark{display:block;width:100%;height:38px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 6px;border-radius:99px;font-weight:600}
.srcgrid{display:grid;gap:5px;font-size:11.5px}
.srcrow{display:grid;grid-template-columns:11px 1fr auto;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%}
.muted{color:var(--muted)}
.tiny{font-size:10.5px;color:var(--faint);line-height:1.45}

/* ---------- responsive ---------- */
#mobtabs{display:none}
@media (max-width:960px){
  #app,#app.drawer-open{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;
    grid-template-areas:"bar" "map" "foot"}
  #rail,#drawer{position:fixed;left:0;right:0;bottom:0;top:auto;height:62dvh;border:none;
    border-top:1px solid var(--line);box-shadow:var(--shadow);z-index:40;
    border-radius:12px 12px 0 0;display:none}
  #app.rail-open #rail{display:flex}
  #app.drawer-open #drawer{display:block}
  #mobtabs{display:flex;gap:6px}
  #searchwrap{flex:1 1 auto}
  .brand span{display:none}
  #foot{font-size:9.5px;gap:9px}
  .ramp .bar,.ramp .lab{width:120px}
}
@media (max-width:960px){
  #resbadge{right:48px;font-size:9.5px;padding:4px 7px;max-width:calc(100% - 60px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (max-width:520px){
  #bar{height:auto;padding:7px 10px;flex-wrap:wrap;gap:8px}
  .brand b{font-size:16px}
  .layerbar{order:5;width:100%;flex-wrap:wrap}
  .layerbar button{flex:1 1 auto;text-align:center;padding:6px 4px;font-size:10.5px;
    border-bottom:1px solid var(--line)}
  #foot{padding:5px 10px}
  #foot>span:last-child{display:none}
}
</style>
